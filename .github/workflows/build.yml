name: Build APK
on:
  push:
    paths:
      - 'KrenometrApp.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q KrenometrApp.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: cd KrenometrApp && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp KrenometrApp/app/build/outputs/apk/debug/app-debug.apk Krenometr.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          files: Krenometr.apk
          make_latest: true
